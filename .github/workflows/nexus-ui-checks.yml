name: NEXUS UI and runtime validation

on:
  pull_request:
    branches:
      - "feat/backend-followup-orchestration"
  push:
    branches:
      - "feat/nexus-workspace-ui-four-layouts"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install lightweight test dependencies
        run: python -m pip install requests fastapi
      - name: Validate Docker Compose configuration
        run: docker compose config --quiet
      - name: Compile application modules
        run: python -m compileall -q api_server.py app.py streamlit_auth.py audit_log.py video_qa.py upload_safety.py review_workflow.py script_templates.py trend_radar.py video_maker.py yt_uploader.py
      - name: Validate browser studio JavaScript syntax
        run: |
          python -c "from pathlib import Path; import re; html=Path('index.html').read_text(encoding='utf-8'); scripts=re.findall(r'<script>(.*?)</script>', html, re.S); assert scripts; Path('/tmp/nexus-studio.js').write_text(scripts[-1], encoding='utf-8')"
          node --check /tmp/nexus-studio.js
      - name: Run regression tests
        run: python -m unittest discover -s tests -v
