name: NEXUS UI and runtime validation

on:
  pull_request:
    branches:
      - "feat/backend-followup-orchestration"
      - "integration/nexus-full-stack-20261127"
  push:
    branches:
      - "feat/nexus-workspace-ui-four-layouts"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install lightweight test dependencies
        run: python -m pip install requests fastapi 'PyJWT[crypto]>=2.10.1,<3.0.0'
      - name: Validate Docker Compose configuration
        run: docker compose config --quiet
      - name: Compile application modules
        run: python -m compileall -q hosted_auth.py supabase_rest.py token_vault.py api_server.py app.py streamlit_auth.py audit_log.py video_qa.py upload_safety.py review_workflow.py script_templates.py trend_radar.py video_maker.py yt_uploader.py
      - name: Validate browser studio JavaScript syntax
        run: |
          python -c "from pathlib import Path; import re; html=Path('index.html').read_text(encoding='utf-8'); scripts=re.findall(r'<script>(.*?)</script>', html, re.S); assert scripts; Path('/tmp/nexus-studio.js').write_text(scripts[-1], encoding='utf-8'); signup=Path('signup.html').read_text(encoding='utf-8'); modules=re.findall(r'<script type=\"module\">(.*?)</script>', signup, re.S); assert modules; Path('/tmp/nexus-signup.mjs').write_text(modules[-1], encoding='utf-8')"
          node --check /tmp/nexus-studio.js
          node --check /tmp/nexus-signup.mjs
      - name: Run regression tests
        run: python -m unittest discover -s tests -v

      - name: Install Playwright browser automation
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Verify real browser interactions in the static preview
        run: |
          python -m http.server 4173 > /tmp/nexus-preview-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          node integration_tests/ui_smoke.mjs
