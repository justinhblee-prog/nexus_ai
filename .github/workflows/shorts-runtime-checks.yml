name: Shorts runtime checks

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - "fix/shorts-runtime-security-bootstrap"

jobs:
  python-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install lightweight test dependency
        run: python -m pip install requests fastapi
      - name: Compile application modules
        run: python -m compileall -q api_server.py app.py trend_radar.py video_maker.py yt_uploader.py
      - name: Run radar database smoke tests
        run: python -m unittest discover -s tests -v
