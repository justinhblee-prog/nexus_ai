name: Supabase local migration validation

on:
  pull_request:
    paths:
      - "supabase/migrations/**"
      - "docs/SHARED_PUBLIC_TREND_STORE_MIGRATION.md"
      - ".github/workflows/supabase-local-migrations.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-local-migrations-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  local-migrations:
    name: Replay and lint local Supabase migrations
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out PR source
        uses: actions/checkout@v4

      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Initialize local Supabase config
        run: supabase init

      - name: Hold migration files until the legacy baseline is installed
        run: |
          mv supabase/migrations supabase/migrations_pending
          mkdir -p supabase/migrations

      - name: Start the isolated local Supabase stack
        run: supabase start --exclude studio,mailpit,logflare,realtime,edge-runtime,postgrest,vector,imgproxy

      - name: Install the pre-NEXUS legacy schema fixture
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
          PGPASSWORD=postgres psql \
            --host 127.0.0.1 --port 54322 --username postgres --dbname postgres \
            --set ON_ERROR_STOP=1 --file supabase/fixtures/legacy_workspace_baseline.sql

      - name: Replay every migration against the legacy baseline
        run: |
          rmdir supabase/migrations
          mv supabase/migrations_pending supabase/migrations
          supabase migration up

      - name: Lint local database functions and schema
        run: supabase db lint --fail-on error

