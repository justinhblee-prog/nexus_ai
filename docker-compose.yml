services:
  shorts-center:
    build: .
    container_name: nexus_ai_shorts_center
    environment:
      NEXUS_API_PASSWORD: ${NEXUS_API_PASSWORD:-}
      NEXUS_SESSION_SECRET: ${NEXUS_SESSION_SECRET:-}
      NEXUS_AUTH_ENABLED: ${NEXUS_AUTH_ENABLED:-false}
      NEXUS_COOKIE_SECURE: ${NEXUS_COOKIE_SECURE:-false}
      NEXUS_HOSTED_AUTH_ENABLED: ${NEXUS_HOSTED_AUTH_ENABLED:-false}
      NEXUS_SUPABASE_URL: ${NEXUS_SUPABASE_URL:-}
      NEXUS_SUPABASE_PUBLISHABLE_KEY: ${NEXUS_SUPABASE_PUBLISHABLE_KEY:-}
      NEXUS_SUPABASE_JWT_ISSUER: ${NEXUS_SUPABASE_JWT_ISSUER:-}
      NEXUS_SUPABASE_JWKS_URL: ${NEXUS_SUPABASE_JWKS_URL:-}
      NEXUS_SUPABASE_JWT_AUDIENCE: ${NEXUS_SUPABASE_JWT_AUDIENCE:-authenticated}
      NEXUS_CORS_ALLOWED_ORIGINS: ${NEXUS_CORS_ALLOWED_ORIGINS:-}
      NEXUS_TOKEN_ENCRYPTION_KEY: ${NEXUS_TOKEN_ENCRYPTION_KEY:-}
      NEXUS_TOKEN_ENCRYPTION_KEY_VERSION: ${NEXUS_TOKEN_ENCRYPTION_KEY_VERSION:-v1}
      NEXUS_TOKEN_ENCRYPTION_KEYS_JSON: ${NEXUS_TOKEN_ENCRYPTION_KEYS_JSON:-}
      NEXUS_QUEUE_WORKERS: ${NEXUS_QUEUE_WORKERS:-1}
    ports:
      - "127.0.0.1:${NEXUS_STREAMLIT_HOST_PORT:-28502}:8502"
      - "127.0.0.1:${NEXUS_API_HOST_PORT:-28503}:8503"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8503/api/session/status', timeout=3); urllib.request.urlopen('http://127.0.0.1:8502/_stcore/health', timeout=3)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    volumes:
      - .:/app
    command: sh -c "uvicorn api_server:app --host 0.0.0.0 --port 8503 & exec streamlit run app.py --server.port=8502 --server.address=0.0.0.0"
    restart: unless-stopped
