<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>NEXUS STUDIO PRO · Workspace</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{color-scheme:dark;--bg:#050811;--panel:#0b101d;--inset:#060a14;--line:#1d2940;--muted:#8b9ab4;--text:#e8eef9;--blue:#55a6ff;--green:#4adea5;--amber:#f5bd62}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 20% -10%,#142344 0,transparent 42%),var(--bg);color:var(--text);font:14px/1.5 Inter,Pretendard,"Segoe UI",sans-serif}.shell{min-height:100vh;display:grid;grid-template-columns:238px 1fr}.side{background:#080d18;border-right:1px solid var(--line);padding:24px 16px;display:flex;flex-direction:column;gap:28px}.brand{font-size:16px;font-weight:800;letter-spacing:.12em;padding:6px 10px}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:.2em;margin-top:4px}.nav{display:grid;gap:7px}.nav button,.logout,.primary,.secondary{border:1px solid transparent;border-radius:10px;padding:11px 12px;background:transparent;color:#b9c6dc;text-align:left;cursor:pointer;font:inherit}.nav button.active,.nav button:hover{background:#14213a;border-color:#243b61;color:#fff}.sidefoot{margin-top:auto;color:var(--muted);font-size:11px;padding:10px}.main{padding:30px clamp(18px,4vw,56px);max-width:1500px;width:100%;margin:0 auto}.top{display:flex;justify-content:space-between;gap:18px;align-items:center;margin-bottom:30px}.eyebrow{color:var(--blue);font-size:10px;font-weight:800;letter-spacing:.18em}.top h1{margin:5px 0 0;font-size:clamp(24px,3vw,34px);letter-spacing:-.04em}.user{color:var(--muted);font-size:12px;overflow-wrap:anywhere}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}.card{background:linear-gradient(145deg,#0d1525,var(--panel));border:1px solid var(--line);border-radius:16px;padding:19px;min-width:0}.metric span{color:var(--muted);font-size:12px}.metric strong{display:block;font-size:32px;letter-spacing:-.04em;margin-top:10px}.metric em{font-style:normal;color:var(--green);font-size:11px}.section{margin-top:18px}.section h2{font-size:16px;margin:0 0 14px}.two{display:grid;grid-template-columns:1.25fr .75fr;gap:14px}.list{display:grid;gap:9px}.item{display:flex;justify-content:space-between;gap:12px;padding:12px;background:var(--inset);border:1px solid #17233a;border-radius:10px}.muted{color:var(--muted)}.pill{font-size:11px;color:#9ecbff;background:#102746;border-radius:99px;padding:3px 8px}.empty{padding:24px;text-align:center;color:var(--muted);background:var(--inset);border:1px dashed var(--line);border-radius:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.primary{background:#1767c5;color:white;padding:10px 15px}.secondary{border-color:var(--line);background:#0d1525}.form{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.form input,.form select{background:var(--inset);color:var(--text);border:1px solid var(--line);border-radius:9px;padding:11px;min-width:180px}.view{display:none}.view.active{display:block}.notice{margin:12px 0;color:var(--muted);font-size:12px}.error{color:#fb8a9a}.loading{color:var(--muted);padding:30px}
@media(max-width:900px){.shell{grid-template-columns:1fr}.side{padding:12px 14px;border-right:0;border-bottom:1px solid var(--line);gap:10px}.brand{padding:4px 6px}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.sidefoot{display:none}.main{padding:22px 16px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.two{grid-template-columns:1fr}}
@media(max-width:480px){.top{align-items:flex-start;flex-direction:column}.metric strong{font-size:27px}.card{padding:15px}}
</style></head>
<body><div id="app" class="loading">로그인 세션과 워크스페이스를 확인하고 있습니다…</div>
<script>
(async()=>{
 const root=document.getElementById('app');
 const say=(m)=>{root.innerHTML='<div class="loading error">'+esc(m)+'<p><a href="/signup" style="color:#8fc5ff">로그인 화면으로 이동</a></p></div>'};
 const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 try{
  if(!window.supabase?.createClient)throw new Error('인증 라이브러리를 불러오지 못했습니다.');
  const cfgRes=await fetch('/api/hosted/auth-config',{cache:'no-store'}),cfg=await cfgRes.json();
  if(!cfgRes.ok)throw new Error(cfg.detail||'인증 설정을 확인하지 못했습니다.');
  const sb=window.supabase.createClient(cfg.supabase_url,cfg.publishable_key,{auth:{persistSession:true,storage:window.sessionStorage,autoRefreshToken:true,detectSessionInUrl:true,flowType:'pkce'}});
  const {data:{session},error}=await sb.auth.getSession();if(error)throw error;if(!session){location.replace('/signup');return}
  const headers={Authorization:'Bearer '+session.access_token};
  const [verifyRes,wsRes]=await Promise.all([fetch('/api/hosted/session',{headers,cache:'no-store'}),fetch('/api/hosted/workspaces',{headers,cache:'no-store'})]);
  if(!verifyRes.ok||!wsRes.ok){await sb.auth.signOut();location.replace('/signup?reason=session');return}
  const verify=await verifyRes.json(),ws=(await wsRes.json()).items||[];
  if(!verify.authenticated||!ws.length){say('로그인 계정에 연결된 워크스페이스를 찾지 못했습니다. 관리자에게 계정 초기화 상태를 확인해 주세요.');return}
  let active=ws[0],data={overview:null,channels:[],jobs:[],topics:[]};
  root.innerHTML='<div class="shell"><aside class="side"><div class="brand">NEXUS STUDIO PRO<small>CREATOR INTELLIGENCE</small></div><nav class="nav"><button class="active" data-view="dashboard">▦ 대시보드</button><button data-view="studio">✦ AI 제작</button><button data-view="review">✓ 검수 대기</button><button data-view="channels">◎ 채널</button><button data-view="topics">⌁ 주제 보관함</button></nav><div class="sidefoot">Human approval required<br>게시 전 최종 승인 · 비공개 기본값</div></aside><main class="main"><header class="top"><div><div class="eyebrow">NEXUS / WORKSPACE</div><h1 id="heading">Dashboard</h1><div class="user" id="workspace-name"></div></div><div class="actions"><span class="user">'+esc(session.user.email||'인증된 사용자')+'</span><button class="secondary" id="logout">로그아웃</button></div></header><div id="notice" class="notice"></div><section class="view active" id="view-dashboard"><div class="grid" id="metrics"></div><div class="two section"><article class="card"><h2>최근 제작 작업</h2><div class="list" id="recent-jobs"></div></article><article class="card"><h2>워크스페이스</h2><div id="workspace-info"></div><div class="form" id="ws-picker"></div><p class="muted">현재 계정의 멤버십 권한 범위 안에서 데이터가 표시됩니다.</p></article></div></section><section class="view" id="view-studio"><article class="card"><h2>새 Shorts 제작 요청</h2><div class="form"><select id="channel"></select><input id="topic" placeholder="영상 주제를 입력하세요"><button class="primary" id="create">제작 요청 등록</button></div><p class="muted">실제 렌더링 및 업로드는 별도 운영 워커 설정과 승인 절차에 따릅니다.</p></article><article class="card section"><h2>제작 작업</h2><div id="studio-jobs" class="list"></div></article></section><section class="view" id="view-review"><article class="card"><h2>사람의 최종 검수 대기열</h2><div id="review-jobs" class="list"></div></article></section><section class="view" id="view-channels"><article class="card"><h2>연결된 채널</h2><div id="channel-list" class="list"></div></article></section><section class="view" id="view-topics"><article class="card"><h2>저장 주제</h2><div class="form"><input id="saved-topic" placeholder="보관할 콘텐츠 주제"><button class="primary" id="save-topic">주제 저장</button></div><div id="topic-list" class="list"></div></article></section></main></div>';
  const $=id=>document.getElementById(id),api=async(path,opts={})=>{const r=await fetch(path,{...opts,headers:{...headers,...(opts.headers||{})},cache:'no-store'});const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.detail||'요청에 실패했습니다 ('+r.status+')');return j};
  $('logout').onclick=async()=>{await sb.auth.signOut();location.replace('/signup')};
  document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-view]').forEach(x=>x.classList.toggle('active',x===b));document.querySelectorAll('.view').forEach(x=>x.classList.toggle('active',x.id==='view-'+b.dataset.view));$('heading').textContent=b.textContent.trim()});
  const load=async()=>{const id=encodeURIComponent(active.workspace_id);const [o,c,j,t]=await Promise.all([api('/api/hosted/workspaces/'+id+'/overview'),api('/api/hosted/workspaces/'+id+'/channels'),api('/api/hosted/workspaces/'+id+'/jobs?limit=50'),api('/api/hosted/workspaces/'+id+'/topic-queue')]);data={overview:o,channels:c.items||[],jobs:j.items||[],topics:t.items||[]};render()};
  function render(){const o=data.overview||{};const m=[['전체 채널',o.channel_count||0],['활성 채널',o.active_channel_count||0],['제작 작업',o.job_count||0],['검수 대기',o.review_pending_count||0]];$('metrics').innerHTML=m.map(x=>'<article class="card metric"><span>'+x[0]+'</span><strong>'+x[1]+'</strong><em>워크스페이스 실제 데이터</em></article>').join('');$('workspace-name').textContent=active.workspace_name+' · '+active.member_role;$('workspace-info').innerHTML='<p><b>'+esc(active.workspace_name)+'</b></p><p class="muted">역할: '+esc(active.member_role)+'</p>';$('ws-picker').innerHTML=ws.length>1?'<select id="workspace-choice">'+ws.map(w=>'<option value="'+esc(w.workspace_id)+'" '+(w.workspace_id===active.workspace_id?'selected':'')+'>'+esc(w.workspace_name)+' · '+esc(w.member_role)+'</option>').join('')+'</select>':'';if($('workspace-choice'))$('workspace-choice').onchange=async e=>{active=ws.find(w=>w.workspace_id===e.target.value)||active;await load()};const jobs=data.jobs.map(j=>'<div class="item"><div><b>'+esc(j.title||j.topic||'제목 미정')+'</b><div class="muted">'+esc(j.stage||j.approval_status||'상태 확인 중')+'</div></div><span class="pill">'+esc(j.approval_status||'대기')+'</span></div>').join('')||'<div class="empty">아직 등록된 제작 작업이 없습니다.</div>';$('recent-jobs').innerHTML=jobs;$('studio-jobs').innerHTML=jobs;$('review-jobs').innerHTML=data.jobs.filter(j=>j.approval_status==='pending').map(j=>'<div class="item"><div><b>'+esc(j.title||j.topic)+'</b><div class="muted">'+esc(j.stage||'검수 대기')+'</div></div><span class="pill">최종 승인 필요</span></div>').join('')||'<div class="empty">현재 검수 대기 작업이 없습니다.</div>';$('channel').innerHTML=data.channels.map(c=>'<option value="'+esc(c.channel_id)+'">'+esc(c.display_name||c.platform)+'</option>').join('');$('channel-list').innerHTML=data.channels.map(c=>'<div class="item"><div><b>'+esc(c.display_name||c.platform)+'</b><div class="muted">'+esc(c.platform)+' · '+(c.is_active?'활성':'비활성')+'</div></div><span class="pill">'+esc(c.persona||'채널')+'</span></div>').join('')||'<div class="empty">연결된 채널이 없습니다. 계정 연결은 기존 로그인 화면에서 진행할 수 있습니다.</div>';$('topic-list').innerHTML=data.topics.map(t=>'<div class="item"><div><b>'+esc(t.topic)+'</b><div class="muted">'+esc(t.source||'manual')+'</div></div></div>').join('')||'<div class="empty">저장된 주제가 없습니다.</div>'}
  $('create').onclick=async()=>{const topic=$('topic').value.trim(),channel_id=$('channel').value;if(!topic||!channel_id){$('notice').textContent='채널과 주제를 먼저 입력하세요.';return}try{await api('/api/hosted/workspaces/'+encodeURIComponent(active.workspace_id)+'/jobs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({channel_id,topic})});$('topic').value='';$('notice').textContent='제작 요청을 등록했습니다.';await load()}catch(e){$('notice').textContent=e.message}};
  $('save-topic').onclick=async()=>{const topic=$('saved-topic').value.trim();if(!topic)return;try{await api('/api/hosted/workspaces/'+encodeURIComponent(active.workspace_id)+'/topic-queue',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({topic,source:'manual'})});$('saved-topic').value='';$('notice').textContent='주제를 저장했습니다.';await load()}catch(e){$('notice').textContent=e.message}};
  await load();
 }catch(e){say(e.message||'워크스페이스를 불러오지 못했습니다.')}
})();
</script></body></html>
