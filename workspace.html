<style>

 let active=workspaces[0],data={overview:{},channels:[],jobs:[],topics:[],trends:[]},layout=localStorage.getItem('nexus-layout')||'intelligence',samplePreview=false;

const $=id=>document.getElementById(id),api=async(path,opts={})=>{const r=await fetch(path,{...opts,headers:{...headers,...(opts.headers||{})},cache:'no-store'});const j=await r.json().catch(()=>({}));if(!r.ok)throw Error(typeof j.detail==='string'?j.detail:'요청 실패 ('+r.status+')');return j};
const say=(m,isErr=false)=>{$('notice').textContent=m;$('notice').classList.toggle('error',isErr)};
function go(name){document.querySelectorAll('.view').forEach(v=>v.classList.toggle('active',v.id==='view-'+name));document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===name));$('heading').textContent=({dashboard:'Dashboard',discovery:'Discovery',studio:'AI Content Studio',review:'Review',publishing:'Publishing',analytics:'Analytics',operations:'Operations',settings:'Settings'})[name]||name; if(name==='settings')syncSettings();}
document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>go(b.dataset.view));
document.querySelectorAll('[data-goto]').forEach(b=>b.onclick=()=>go(b.dataset.goto));
$('settings-shortcut').onclick=()=>go('settings');$('logout').onclick=async()=>{await sb.auth.signOut();location.replace('/signup')};
$('workspace-choice').innerHTML=workspaces.map(w=>'<option value="'+esc(w.workspace_id)+'">'+esc(w.workspace_name)+' · '+esc(w.member_role)+'</option>').join('');
$('workspace-choice').onchange=async e=>{active=workspaces.find(w=>w.workspace_id===e.target.value)||active;await load()};
const setMetric=(node,items)=>$(node).innerHTML=items.map(x=>'<article class="card metric"><span class="label">'+esc(x[0])+'</span><strong>'+esc(x[1])+'</strong><small>'+esc(x[2]||'실제 워크스페이스 데이터')+'</small></article>').join('');
function render(){
 const o=data.overview||{},jobs=data.jobs||[],channels=data.channels||[];
 const m=samplePreview?[['Videos in Pipeline','24','샘플 미리보기'],['Scripts Ready','12','샘플 미리보기'],['Review Pending','5','샘플 미리보기'],['Scheduled Posts','8','샘플 미리보기']]:[['Videos in Pipeline',o.job_count||0,'전체 제작 작업'],['Scripts / Jobs Queued',o.queued_count||0,'제작 대기'],['Review Pending',o.review_pending_count||0,'사람의 최종 검토'],['Published (Private)',o.published_count||0,'게시 완료 상태']];
 setMetric('metrics',m);setMetric('publishing-metrics',[['연결 채널',channels.length],['게시 완료',o.published_count||0],['승인 대기',o.review_pending_count||0],['예약 게시','연동 대기','예약 API 미구현']]);
 setMetric('analytics-kpis',[['연결 채널',channels.length],['콘텐츠 누적',o.job_count||0],['성과 지표','연동 대기','조회수·시청시간 API 미연결']]);
 setMetric('operations-kpis',[['전체 작업',o.job_count||0],['대기열',o.queued_count||0],['승인 대기',o.review_pending_count||0],['활성 채널',o.active_channel_count||0]]);
 $('workspace-name').textContent=active.workspace_name+' · '+active.member_role;$('workspace-info').innerHTML='<div class="statline"><span>워크스페이스</span><b>'+esc(active.workspace_name)+'</b></div><div class="statline"><span>멤버 권한</span><b>'+esc(active.member_role)+'</b></div><div class="statline"><span>전체 채널</span><b>'+channels.length+'</b></div>';
 $('channel-summary').innerHTML=channels.length?channels.slice(0,5).map(c=>'<div class="statline"><span>'+esc(c.display_name||c.platform)+'</span><b class="pill '+(c.is_active?'green':'')+'">'+(c.is_active?'활성':'비활성')+'</b></div>').join(''):empty('연결된 채널이 없습니다.');
 const mix=channels.map(ch=>({name:ch.display_name||ch.platform,count:jobs.filter(j=>j.channel_id===ch.channel_id).length}));const maxMix=Math.max(1,...mix.map(x=>x.count));$('content-mix').innerHTML=mix.length?mix.map(x=>'<div class="bar-row"><span>'+esc(x.name.slice(0,9))+'</span><div class="bar"><i style="width:'+Math.round(x.count/maxMix*100)+'%"></i></div><span>'+x.count+'</span></div>').join(''):empty('채널별 제작 데이터가 없습니다.');
 const jobHtml=j=>'<div class="item"><div class="item-main"><b>'+esc(j.title||j.topic||'제목 미정')+'</b><div class="meta">'+esc(j.stage||'상태 미정')+' · '+esc(new Date(j.created_at).toLocaleString('ko-KR'))+'</div></div><span class="pill '+(j.approval_status==='approved'?'green':j.approval_status==='pending'?'amber':'')+'">'+esc(statusText(j.approval_status||j.stage))+'</span></div>';
 const demoJobs=[{title:'AI 업무 자동화 5가지',stage:'rendered',approval_status:'pending',created_at:new Date().toISOString()},{title:'2026 글로벌 테크 트렌드',stage:'review_pending',approval_status:'pending',created_at:new Date().toISOString()},{title:'생산성을 높이는 도구',stage:'published',approval_status:'approved',created_at:new Date().toISOString()}];
 $('recent-jobs').innerHTML=(samplePreview?demoJobs:jobs.slice(0,6)).map(jobHtml).join('')||empty('아직 제작 작업이 없습니다.');
 $('studio-jobs').innerHTML=jobs.map(jobHtml).join('')||empty('새 제작 요청을 등록하면 여기에 표시됩니다.');
 const pending=jobs.filter(j=>j.approval_status==='pending'&&j.stage==='review_pending');
 $('review-list').innerHTML=pending.map(j=>'<article class="card"><div class="item-main"><b>'+esc(j.title||j.topic||'제목 미정')+'</b><p class="muted">'+esc(j.stage)+' · 최종 승인 대기</p></div><div class="toolbar"><button class="btn" data-preview="'+esc(j.job_id)+'">영상 미리보기</button><button class="btn primary" data-approve="'+esc(j.job_id)+'">최종 승인</button></div><div id="preview-'+esc(j.job_id)+'"></div></article>').join('')||empty('현재 최종 검토 대기 콘텐츠가 없습니다.');
 $('channel').innerHTML=channels.map(c=>'<option value="'+esc(c.channel_id)+'">'+esc(c.display_name||c.platform)+'</option>').join('')||'<option value="">먼저 채널을 연결하세요</option>';
 $('publishing-channels').innerHTML=channels.map(c=>'<div class="item"><div><b>'+esc(c.display_name||c.platform)+'</b><div class="meta">'+esc(c.platform)+' · '+(c.is_active?'활성':'비활성')+'</div></div><span class="pill">'+esc(c.persona||'채널')+'</span></div>').join('')||empty('연결된 게시 채널이 없습니다.');
 $('ops-summary').innerHTML=[['작업 전체',o.job_count||0],['제작 대기',o.queued_count||0],['검수 대기',o.review_pending_count||0],['게시 완료',o.published_count||0]].map(x=>'<div class="statline"><span>'+x[0]+'</span><b>'+x[1]+'</b></div>').join('');
 $('pipeline').innerHTML=[['Discovery','트렌드 탐색 및 주제 큐'],['Production',(o.queued_count||0)+'개 대기'],['Review',(o.review_pending_count||0)+'개 승인 대기'],['Publishing',(o.published_count||0)+'개 게시 완료'],['Analytics','실제 성과 API 연동 대기']].map(x=>'<div class="statline"><span>'+x[0]+'</span><b>'+x[1]+'</b></div>').join('');
 $('operations-jobs').innerHTML=jobs.slice(0,8).map(jobHtml).join('')||empty('최근 운영 작업이 없습니다.');
 $('layout-label').textContent='LAYOUT · '+layout.toUpperCase()+(samplePreview?' · SAMPLE PREVIEW':'');$('sample-toggle').textContent=samplePreview?'실제 데이터로 돌아가기':'샘플 데이터 미리보기';
 document.querySelectorAll('[data-approve]').forEach(b=>b.onclick=async()=>{if(!['owner','admin'].includes(active.member_role)){say('최종 승인은 워크스페이스 소유자 또는 관리자만 할 수 있습니다.',true);return}if(!confirm('이 콘텐츠를 최종 승인하시겠습니까?'))return;b.disabled=true;try{await api('/api/hosted/jobs/'+encodeURIComponent(b.dataset.approve)+'/approve',{method:'POST'});say('최종 승인이 저장되었습니다.');await load()}catch(e){say(e.message,true);b.disabled=false}});
 document.querySelectorAll('[data-preview]').forEach(b=>b.onclick=async()=>{const target=$('preview-'+b.dataset.preview);b.disabled=true;try{const p=await api('/api/hosted/jobs/'+encodeURIComponent(b.dataset.preview)+'/preview');target.innerHTML='<video class="preview" controls playsinline src="'+esc(p.signed_url)+'"></video><p class="muted">보안 서명 URL · 제한 시간 동안 재생 가능</p>'}catch(e){target.innerHTML='<p class="muted">'+esc(e.message)+'</p>'}finally{b.disabled=false}});
}
function renderTopics(){$('topic-list').innerHTML=data.topics.map(t=>'<div class="item"><div class="item-main"><b>'+esc(t.topic)+'</b><div class="meta">'+esc(t.region||'Global')+' · '+esc(t.source_name||t.source||'manual')+'</div></div><button class="btn" data-delete-topic="'+esc(t.topic_id)+'">삭제</button></div>').join('')||empty('저장된 주제가 없습니다.');document.querySelectorAll('[data-delete-topic]').forEach(b=>b.onclick=async()=>{try{await api('/api/hosted/workspaces/'+encodeURIComponent(active.workspace_id)+'/topic-queue/'+encodeURIComponent(b.dataset.deleteTopic),{method:'DELETE'});await load();say('주제를 삭제했습니다.')}catch(e){say(e.message,true)}})}
function renderTrends(){const items=data.trends; $('trends').innerHTML=items.map(t=>'<div class="item trend"><div><b>'+esc(t.topic||t.title||t.name||'Trend')+'</b><small>'+esc([t.region,t.source_name||t.source,t.category].filter(Boolean).join(' · '))+'</small></div><button class="btn" data-save-trend="'+esc(t.topic||t.title||t.name||'')+'">주제 저장</button></div>').join('')||empty('현재 제공되는 공개 트렌드 신호가 없습니다.');document.querySelectorAll('[data-save-trend]').forEach(b=>b.onclick=async()=>{try{await api('/api/hosted/workspaces/'+encodeURIComponent(active.workspace_id)+'/topic-queue',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({topic:b.dataset.saveTrend,source:'trend-radar'})});await load();say('트렌드를 제작 주제 큐에 저장했습니다.')}catch(e){say(e.message,true)}})}
async function load(){say('워크스페이스 데이터를 불러오는 중…');try{const id=encodeURIComponent(active.workspace_id);const [o,c,j,t]=await Promise.all([api('/api/hosted/workspaces/'+id+'/overview'),api('/api/hosted/workspaces/'+id+'/channels'),api('/api/hosted/workspaces/'+id+'/jobs?limit=50'),api('/api/hosted/workspaces/'+id+'/topic-queue')]);let trends=[];try{const tr=await api('/api/hosted/workspaces/'+id+'/trends');trends=Array.isArray(tr)?tr:(tr.items||tr.trends||[])}catch(trendError){say('기본 데이터는 동기화했습니다. 트렌드 소스는 현재 조회할 수 없습니다: '+trendError.message,true)}data={overview:o,channels:c.items||[],jobs:j.items||[],topics:t.items||[],trends};render();renderTopics();renderTrends();if(!document.querySelector('.notice.error'))say('데이터 동기화 완료 · '+new Date().toLocaleTimeString('ko-KR'))}catch(e){say(e.message,true)}}
$('refresh').onclick=load;$('refresh-ops').onclick=load;$('refresh-trends').onclick=load;$('sample-toggle').onclick=()=>{samplePreview=!samplePreview;render();say(samplePreview?'샘플 데이터 미리보기입니다. 실제 계정 데이터는 변경되지 않았습니다.':'실제 워크스페이스 데이터로 돌아왔습니다.')};
$('create-form').onsubmit=async e=>{e.preventDefault();const topic=$('topic').value.trim(),channel_id=$('channel').value;if(!topic||!channel_id){say('게시 채널을 먼저 연결하고 주제를 입력하세요.',true);return}try{await api('/api/hosted/workspaces/'+encodeURIComponent(active.workspace_id)+'/jobs',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({channel_id,topic})});$('topic').value='';say('Shorts 제작 요청을 등록했습니다.');await load()}catch(err){say(err.message,true)}};
$('topic-form').onsubmit=async e=>{e.preventDefault();const topic=$('saved-topic').value.trim();if(!topic)return;try{await api('/api/hosted/workspaces/'+encodeURIComponent(active.workspace_id)+'/topic-queue',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({topic,source:'manual'})});$('saved-topic').value='';await load();say('제작 주제를 저장했습니다.')}catch(err){say(err.message,true)}};
const accentMap={blue:'#4d8dff',purple:'#9b87f5',green:'#39d6a0',coral:'#ff7f73'};$('accent-preset').onchange=()=>{const key=$('accent-preset').value;if(accentMap[key])$('accent-color').value=accentMap[key]};
function applySettings(){document.documentElement.dataset.layout=layout;document.documentElement.dataset.theme=localStorage.getItem('nexus-theme')||'navy';document.documentElement.dataset.card=localStorage.getItem('nexus-card')||'rounded';document.documentElement.dataset.density=localStorage.getItem('nexus-density')||'comfortable';document.documentElement.dataset.chart=localStorage.getItem('nexus-chart')||'expanded';const fonts={pretendard:'Pretendard, Malgun Gothic, system-ui, sans-serif',malgun:'Malgun Gothic, sans-serif',system:'system-ui, sans-serif'};document.body.style.fontFamily=fonts[localStorage.getItem('nexus-font')||'pretendard'];document.documentElement.style.setProperty('--accent',localStorage.getItem('nexus-accent')||'#4d8dff')}
function syncSettings(){$('layout').value=layout;$('theme').value=localStorage.getItem('nexus-theme')||'navy';$('card-style').value=localStorage.getItem('nexus-card')||'rounded';$('accent-color').value=localStorage.getItem('nexus-accent')||'#4d8dff';$('density').value=localStorage.getItem('nexus-density')||'comfortable';$('font-family').value=localStorage.getItem('nexus-font')||'pretendard';$('chart-style').value=localStorage.getItem('nexus-chart')||'expanded';}
$('save-settings').onclick=()=>{layout=$('layout').value;localStorage.setItem('nexus-layout',layout);localStorage.setItem('nexus-theme',$('theme').value);localStorage.setItem('nexus-card',$('card-style').value);localStorage.setItem('nexus-accent',$('accent-color').value);localStorage.setItem('nexus-density',$('density').value);localStorage.setItem('nexus-font',$('font-family').value);localStorage.setItem('nexus-chart',$('chart-style').value);applySettings();document.body.style.setProperty('--density',$('density').value);$('layout-label').textContent='LAYOUT · '+layout.toUpperCase();say('화면 설정을 저장했습니다.')};
$('reset-settings').onclick=()=>{layout='intelligence';['nexus-layout','nexus-theme','nexus-card','nexus-accent','nexus-density','nexus-font','nexus-chart'].forEach(k=>localStorage.removeItem(k));syncSettings();applySettings();say('기본 화면 설정으로 복원했습니다.')};
applySettings();syncSettings();await load();
}catch(e){root.innerHTML='<div class="loading error">'+esc(e.message||'워크스페이스를 불러오지 못했습니다.')+'<p><a href="/signup" style="color:#8fc5ff">로그인 화면으로 이동</a></p></div>'}
})();
</script></body></html>
